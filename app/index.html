<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" id="controls">
    <h1>VICE CITY COVER STUDIO</h1>
    <p class="tagline">Turn a photo and a caption into GTA-style cover art. Runs entirely offline in your browser.</p>

    <label>Layout
      <select id="layout">
        <option value="hero" selected>Hero — big panel left, two small right</option>
        <option value="triptych">Triptych — three tall panels</option>
        <option value="quad">Quad — 2 x 2 panels</option>
        <option value="single">Single — one full-bleed photo</option>
      </select>
    </label>

    <label>Colour grade
      <select id="grade">
        <option value="sunset" selected>Sunset — orange and magenta</option>
        <option value="neon">Neon — cyan and magenta</option>
        <option value="gold">Gold — teal shadows and gold</option>
        <option value="noir">Noir — desaturated, high contrast</option>
      </select>
    </label>

    <label>Export size
      <select id="size">
        <option value="1080x1080" selected>1080 x 1080 — square</option>
        <option value="1080x1350">1080 x 1350 — portrait</option>
        <option value="1920x1080">1920 x 1080 — landscape</option>
      </select>
    </label>

    <label>Caption <input id="caption" type="text" maxlength="40" value="SUNSET HEIST"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="60" value="VICE CITY"></label>
    <label class="check"><input id="fillAll" type="checkbox"> One photo fills all panels</label>

    <fieldset class="panel" id="panel-0">
      <legend>Panel 1</legend>
      <input id="photo-0" type="file" accept="image/*">
      <button id="sample-0" type="button">Use sample</button>
      <label>Zoom <input id="zoom-0" type="range" min="1" max="3" step="0.05" value="1"></label>
      <label>Pan X <input id="ox-0" type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Pan Y <input id="oy-0" type="range" min="-1" max="1" step="0.05" value="0"></label>
    </fieldset>

    <fieldset class="panel" id="panel-1">
      <legend>Panel 2</legend>
      <input id="photo-1" type="file" accept="image/*">
      <button id="sample-1" type="button">Use sample</button>
      <label>Zoom <input id="zoom-1" type="range" min="1" max="3" step="0.05" value="1"></label>
      <label>Pan X <input id="ox-1" type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Pan Y <input id="oy-1" type="range" min="-1" max="1" step="0.05" value="0"></label>
    </fieldset>

    <fieldset class="panel" id="panel-2">
      <legend>Panel 3</legend>
      <input id="photo-2" type="file" accept="image/*">
      <button id="sample-2" type="button">Use sample</button>
      <label>Zoom <input id="zoom-2" type="range" min="1" max="3" step="0.05" value="1"></label>
      <label>Pan X <input id="ox-2" type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Pan Y <input id="oy-2" type="range" min="-1" max="1" step="0.05" value="0"></label>
    </fieldset>

    <fieldset class="panel" id="panel-3">
      <legend>Panel 4</legend>
      <input id="photo-3" type="file" accept="image/*">
      <button id="sample-3" type="button">Use sample</button>
      <label>Zoom <input id="zoom-3" type="range" min="1" max="3" step="0.05" value="1"></label>
      <label>Pan X <input id="ox-3" type="range" min="-1" max="1" step="0.05" value="0"></label>
      <label>Pan Y <input id="oy-3" type="range" min="-1" max="1" step="0.05" value="0"></label>
    </fieldset>

    <button id="export" type="button">Export PNG 1080 x 1080</button>
    <p id="status" role="status">Pick a photo for a panel, or use a sample.</p>
  </section>
  <section class="preview">
    <canvas id="cover" width="1080" height="1080" aria-label="Cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
